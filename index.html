<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamza Sports - Welcome</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <header>
        <nav>
            <div class="logo">
                <h1>HAMZA SPORTS</h1>
            </div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
<!-- Main Hero Section - Full Screen -->
    <main>
        <section class="hero-section">
            <!-- 3D Floating Elements -->
            <div class="floating-shapes">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
                <div class="shape shape-4"></div>
            </div>

            <!-- Hero Content -->
            <div class="hero-content">
                <div class="hero-text">
                    <h2 class="main-heading">Welcome to Hamza Sports</h2>
                    <p class="sub-heading">Elevate Your Game to the Next Level</p>
                    <div class="cta-buttons">
                        <button class="btn-primary">Explore Now</button>
                        <button class="btn-secondary">Learn More</button>
                    </div>
                </div>

                <!-- 3D Feature Cards -->
                <div class="feature-cards">
                    <article class="card">
                        <div class="card-icon">⚽</div>
                        <h3>Premium Gear</h3>
                        <p>Top quality equipment</p>
                    </article>
                    <article class="card">
                        <div class="card-icon">🏆</div>
                        <h3>Championships</h3>
                        <p>Join elite events</p>
                    </article>
                    <article class="card">
                        <div class="card-icon">💪</div>
                        <h3>Training</h3>
                        <p>Expert coaching</p>
                    </article>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>Developed by [Hamza]</p>
    </footer>

</body>
</html>
